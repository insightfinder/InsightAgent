# Fluent Bit: tail a local log file and stream it to InsightFinder.
#
# Required environment variables:
#   IF_HOST          InsightFinder host, e.g. app.insightfinder.com
#   IF_USER_NAME     InsightFinder user name
#   IF_LICENSE_KEY   InsightFinder license key
#   IF_PROJECT_NAME  Log project to send to (must already exist, see README.md)
#   LOG_PATH         File(s) to tail, e.g. /var/log/myapp/*.log
#
# Optional settings read by insightfinder.lua are listed in README.md.

[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

# The log file(s) to send. Each line becomes one InsightFinder log entry.
[INPUT]
    Name              tail
    Tag               if.log
    Path              ${LOG_PATH}
    # Remembers file offsets so restarts don't resend or skip lines
    DB                /var/lib/fluent-bit/insightfinder-tail.db
    # Off: only send lines written after the first start. On: send existing content too.
    Read_from_Head    Off
    Skip_Long_Lines   On
    Refresh_Interval  10
    Mem_Buf_Limit     50MB
    # To send structured fields instead of the raw line, enable a parser
    # from parsers.conf, e.g.:
    # Parser            json

# Heartbeat so batches are flushed even when the file goes quiet.
# Its records are consumed by the Lua filter and never sent.
[INPUT]
    Name   dummy
    Tag    if.tick
    Dummy  {"tick":1}
    Rate   1

# Builds the InsightFinder JSON payload and batches records.
[FILTER]
    Name    lua
    Match   if.*
    script  insightfinder.lua
    call    to_insightfinder

[OUTPUT]
    Name             http
    Match            if.*
    Host             ${IF_HOST}
    Port             443
    URI              /api/v1/customprojectrawdata
    tls              On
    tls.verify       On
    body_key         $body
    headers_key      $headers
    Retry_Limit      5
