# Parsers referenced by fluent-bit.conf. Add your own here if your log lines
# need a custom format (see https://docs.fluentbit.io/manual/pipeline/parsers).

# One JSON object per line
[PARSER]
    Name         json
    Format       json
    Time_Key     time
    Time_Format  %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep    On
